<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Note seven page</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="/register" method="post" autocomplete="on">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="Name">Name:</label>
            <input type="text" id="Name" name="name" placeholder="Enter your name" required><br><br>
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" placeholder="Enter your email" required><br><br>
            <label for="phone">Phone:</label>
            <input type="text" id="phone" name="phone" placeholder="Enter 10 Digit number " required><br><br>
            <label for="dob">Date of Birth:</label>
            <input type-="date" id="dob" name="dob" required><br><br>
            <!-- Gender start now  -->
             <label><b>Gender</b></label><br>
             <label for="Male">Male</label>
             <input type="radio" id="male" name="gender" value="male"><br>
             <label for="female">Female</label>
             <input type="radio" id="female" name="gender" valsue="female"><br><br>
        </fieldset>
        <br>
        <fieldset>
            <legend>Educational Information </legend>
            <label for="course">course</label>
            <select id="course" name="course" required>
                <option value="">Choose course</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="java">JAVA</option>
                <option value="c++">C++</option>
            </select>
            <br>
            <!-- start skills -->
             <label><strong>Skills:</strong></label><br>
             <label for="s1">HTML</label>
             <input type="checkbox" id="s1" name="skills" value="html">
             <label for="s2">CSS</label>
             <input type="checkbox" id="s2" name="skills" value="css">
             <br>
             <!-- Resume Start now -->
              <label><strong>Resume:</strong></label><br>
              <label for="resume">Upload Resume</label>
              <input type="file" id="resume" name="resume" accept=".pdf,.dox,.doc">
              <br><br>
              <label for="address"><b>Address:</b></label>
              <textarea id="address" name="address" placeholder="Enter your address" rows="4" cols="30" required></textarea>
        </fieldset>
        <br><br>
        <label for="terms">I agree to the terms and condition:</label>
        <input type="checkbox" id="terms" name="terms" required><br><br>
        <button type="submit">Register</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
